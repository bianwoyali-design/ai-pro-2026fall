[project]
name = "hw1"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "bianwoyali", email = "bianwoyali@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "torch==2.14.0+cu132",
    "torchvision==0.29.0+cu132",
    "wandb>=0.30.0",
]

[project.scripts]
hw1 = "hw1:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = { index = "pytorch-cu132" }
torchvision = { index = "pytorch-cu132" }

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
